name: publish

# FORK_PUBLISH_BLOCKED
# This fork does not publish packages to pub.dev.
# Git history of tag v0.3.1 still has the upstream publish workflow.
# A version tag or a manual run fails closed instead of publishing.
# Publishing needs a new package name and a maintainer decision.
# Recorded 2026-11-12.

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  blocked:
    name: Publishing is blocked on this fork
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish
        run: |
          echo "FORK_PUBLISH_BLOCKED: this fork does not publish to pub.dev."
          exit 1
