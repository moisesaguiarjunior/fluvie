name: Quality

# Always create the check for a PR: workflow path filters can leave required
# checks pending. The local hooks select checks from the actual changed paths.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Hook regressions and maintained package checks
        run: bash tool/check.sh

  native-export:
    name: Native animation export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/fluvie_cli
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install development encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # CLI format, analysis, raw-frame timing and default tests are in the
      # required Repository checks job through maintained-packages.txt.
      - name: Resolve capture dependencies
        run: flutter pub get --enforce-lockfile
      - name: Decode and verify native animation timing
        env:
          FLUVIE_FFMPEG: ffmpeg
        run: dart test --tags ffmpeg test/render_e2e_test.dart --plain-name 'native Flutter animation follows exact 29fps CLI timestamps'
