name: images

# FORK_PUBLISH_BLOCKED
# This fork does not push container images or call deploy webhooks.
# Git history of tag v0.3.1 still has the upstream image workflow.
# A version tag or a manual run fails closed instead of pushing.
# Recorded 2026-11-12.

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  blocked:
    name: Image publish is blocked on this fork
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to push images
        run: |
          echo "FORK_PUBLISH_BLOCKED: this fork does not push container images."
          exit 1
