# The library package: root strictness + the custom_lint plugin, and docs
# are mandatory on every public member (only here; the root disables it).
include: ../../analysis_options.yaml

# Declared directly, not only via the root include, so the published package
# formats at width 100 on its own (a consumer or pana resolving it standalone
# does not have ../../analysis_options.yaml).
formatter:
  page_width: 100

analyzer:
  errors:
    # 2026-11-12: Flutter 3.47.9 reports analyzer.plugins as the legacy
    # custom_lint registration (analysis_options_deprecated_plugins). The
    # plugin stays so fluvie_lints still run. included_file_warning is the
    # same diagnostic repeated by files that include this one. This ignore
    # also suppresses any other included-file warning in this package.
    analysis_options_deprecated_plugins: ignore
    included_file_warning: ignore
  exclude:
    - build/**
  plugins:
    - custom_lint

linter:
  rules:
    public_member_api_docs: true
